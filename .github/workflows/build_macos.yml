name: Build Engine (macOS)

on:
  push:
    branches: [feature/macos-build]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p fruits_editor

      - name: Package
        run: |
          PKG="fruits-engine-macos-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/fruits_editor" "dist/$PKG/fruits_engine"
          tar -C "dist/$PKG" -czf "dist/$PKG.tar.gz" fruits_engine
          shasum -a 256 "dist/$PKG.tar.gz" > "dist/$PKG.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.tar.gz*
          retention-days: 3

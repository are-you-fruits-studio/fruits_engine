name: Deploy Docs

on:
  push:
    branches:
      - feature/docs-generation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Linux build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libudev-dev pkg-config
          version: 1.1

      - name: Install cargo-doc-docusaurus
        run: cargo install cargo-doc-docusaurus --version 0.1.1 --locked
        working-directory: .

      - name: Generate rustdoc JSON
        run: cargo +nightly doc --workspace --no-deps
        working-directory: .
        env:
          RUSTDOCFLAGS: -Z unstable-options --output-format json

      - name: Generate Docusaurus API reference
        run: |
          find docs/api-reference -mindepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          mkdir -p docs/api-reference

          cargo doc-docusaurus components init docs

          workspace_crates="$(find target/doc -maxdepth 1 -name '*.json' -printf '%f\n' \
            | sed 's/\.json$//' \
            | sort \
            | paste -sd, -)"

          for json in target/doc/*.json; do
            cargo doc-docusaurus "$json" \
              -o docs/api-reference \
              --base-path "/api-reference" \
              --workspace-crates "$workspace_crates"
          done
        working-directory: .

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
